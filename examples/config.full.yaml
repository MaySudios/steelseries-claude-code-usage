# steelseries-claude-code-usage — full annotated configuration
# Docs: https://github.com/MaySudios/steelseries-claude-code-usage
# Tip: run `sscu preview` to see your screens + key colours in the terminal.
#
# Everything here is optional — delete any line to fall back to its default.
# This is the same content `sscu config init` writes.

game: CLAUDE_CODE_USAGE
displayName: Claude Code Usage
developer: MaySudios

pollIntervalSeconds: 10

# auto | calculate | display
costMode: auto
offlinePricing: false

sessionLengthHours: 5
lookbackDays: 35

currencySymbol: '$'
recentWindowMinutes: 5 # live burn rate window (0 = no idle-off)
burnScaleTokensPerMin: 50000 # tokens/min mapped to 100% on the burn pulse
usageWarnPct: 70
usageCriticalPct: 90

# --- OLED screens -------------------------------------------------------------
# Each screen is TEXT (lines + optional icon) or IMAGE (logo/bitmap).
# Text lines use ${metric.id} placeholders. icon: built-in name. image: "claude"
# or a .pbm path. seconds: per-screen duration (defaults to rotateSeconds).
oled:
  enabled: true
  deviceType: screened
  rotateSeconds: 4
  screens:
    - title: Logo
      image: claude
      seconds: 3
    - title: Live block
      icon: money
      lines:
        - '5h ${block.cost}  ${block.timeLeft}'
        - 'use ${block.usagePct}  ${block.tokens}'
    - title: Burn
      icon: lightning
      lines:
        - 'burn ${block.burnRate}'
        - 'proj ${block.projCost}'
    - title: Totals
      icon: clock
      lines:
        - 'today ${today.cost}'
        - 'month ${month.cost}'

# --- Per-key RGB --------------------------------------------------------------
# type: gauge | threshold | pulse
keys:
  enabled: true
  bindings:
    - id: headroom
      type: gauge
      metric: block.usagePct
      keys: [f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12]
      from: '#00ff00'
      to: '#ff0000'
    - id: burn
      type: pulse
      metric: block.burnPct
      keys: [scrolllock]
      color: '#8000ff'
      minHz: 1
      maxHz: 2
      idleBelow: 5
      steady: false # true = solid colour when active instead of pulsing
    - id: alert
      type: threshold
      metric: block.usagePct
      keys: [printscreen]
      bands:
        - { upTo: 50, color: '#00ff00' }
        - { upTo: 80, color: '#ffbf00' }
        - { upTo: 100, color: '#ff0000' }
      flash: { atOrAbove: 95, hz: 4 }

# --- Plan limits (optional, Lucxar-style) ------------------------------------
planLimits:
  enabled: false
  # credentialsPath: ~/.claude/.credentials.json
